spring:
  application:
    name: job-queue-system

  # ── Disable auto Docker management ──────────────────
  docker:
    compose:
      enabled: false

  # Database
  datasource:
    url: jdbc:postgresql://localhost:5432/jqs_db
    username: jqs_user
    password: jqs_pass
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns schema, not Hibernate
    properties:
      hibernate:
        format_sql: true        # makes logged SQL readable
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Server
server:
  port: 8080

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: job-queue-system

logging:
  level:
    root: INFO
    org.springframework.web: INFO

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000   # 24 hours in milliseconds