version: "3.9"

services:

  postgres:
    image: postgres:15-alpine
    container_name: jqs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jqs_user
      POSTGRES_PASSWORD: jqs_pass
      POSTGRES_DB: jqs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jqs_user -d jqs_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jqs_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data: